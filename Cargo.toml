[package]
name = "rust-copilot"
version = "0.1.0"
edition = "2024"

[dependencies]
github-copilot-sdk = { version = "1.0.0-beta.4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
